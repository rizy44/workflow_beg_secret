# =============================================================================
# Source of truth: which OpenBao values go to which GitHub / Jenkins targets.
# This file contains ONLY references (path + key), never secret values.
# Values live in OpenBao KV v2:  <mount>/data/<path>  ->  { key: value, ... }
# =============================================================================

openbao:
  mount: kv            # default KV v2 mount; can be overridden per entry with `mount:`

# ----------------------------------------------------------------------------- GitHub
# target: repo | environment | org
github:
  - target: repo
    repo: rizy44/demo-app
    secrets:
      - name: DOCKERHUB_TOKEN
        path: ci/dockerhub
        key: token

  - target: environment
    repo: rizy44/demo-app
    environment: production
    secrets:
      - name: DB_PASSWORD
        path: apps/demo-app/prod
        key: db_password

  # Organization secrets (needs an org + org-level "Secrets" permission):
  # - target: org
  #   org: my-org
  #   visibility: selected          # all | private | selected
  #   selected_repositories: [my-org/app-a, my-org/app-b]
  #   secrets:
  #     - name: SONAR_TOKEN
  #       path: ci/sonar
  #       key: token

# ----------------------------------------------------------------------------- Jenkins
jenkins:
  url: https://jenkins.example.com
  # Jenkins API user/token read from OpenBao (env JENKINS_USER/JENKINS_API_TOKEN override this)
  auth:
    path: ci/jenkins-admin
    username_key: username
    token_key: api_token

  stores:
    - # no `folder` => system (global) store
      credentials:
        - id: dockerhub-token
          type: string
          description: Docker Hub token (managed by beg_secret_management)
          path: ci/dockerhub
          key: token

        - id: dockerhub-login
          type: usernamePassword
          description: Docker Hub login (managed by beg_secret_management)
          path: ci/dockerhub
          username_key: username
          password_key: token

    - folder: demo-app            # folder store: /job/demo-app/credentials/...
      credentials:
        - id: deploy-ssh
          type: sshPrivateKey
          description: Deploy key (managed by beg_secret_management)
          path: apps/demo-app/prod
          username: deploy                # literal, or username_key: ...
          private_key_key: ssh_private_key
          # passphrase_key: ssh_passphrase

        - id: kubeconfig-prod
          type: file
          description: kubeconfig prod (managed by beg_secret_management)
          path: apps/demo-app/prod
          key: kubeconfig
          file_name: kubeconfig
