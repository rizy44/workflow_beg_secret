# =============================================================================
# Manifest: which OpenBao values are COPIED into Jenkins credentials.
# Only references (path + key), never values.
#
# GitHub Actions does NOT need entries here: pipelines read OpenBao at runtime
# with the composite action  rizy44/workflow_beg_secret/.github/actions/openbao-secrets
# (see docs/secret-paths.md for the path layout).
# =============================================================================

openbao:
  mount: kv/test          # KV v2 mount (inside BAO_NAMESPACE)

# Exception only: copy into a GitHub secret when it cannot be read at runtime
# (e.g. `container.credentials`, `services.*.credentials`, Dependabot).
# github:
#   - target: org
#     org: my-org
#     visibility: private
#     secrets:
#       - name: REGISTRY_PASSWORD
#         path: github/registry
#         key: password

jenkins:
  url: https://jenkins.example.com
  auth:                       # Jenkins API user/token used to write credentials
    path: platform/jenkins-admin
    username_key: username
    token_key: api_token

  stores:
    - # no `folder` => system (global) store
      credentials:
        - id: dockerhub-login
          type: usernamePassword
          description: Docker Hub (managed by beg_secret_management)
          path: common/dockerhub
          username_key: username
          password_key: token

        - id: sonar-token
          type: string
          description: SonarQube token (managed by beg_secret_management)
          path: jenkins/sonarqube
          key: token

        - id: git-deploy-key
          type: sshPrivateKey
          description: Git SSH deploy key (managed by beg_secret_management)
          path: jenkins/git-ssh
          username: git
          private_key_key: private_key

    # Folder store example:
    # - folder: team-a
    #   credentials:
    #     - id: kubeconfig-prod
    #       type: file
    #       path: jenkins/team-a/kubeconfig-prod
    #       key: kubeconfig
    #       file_name: kubeconfig
