[project]
name = "workflow-beg-secret-scripts"
version = "0.1.0"
description = "Stage scripts for the generic CI workflow (OpenBao secrets, sync to Jenkins)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["common", "openbao", "conftest"]
