# Test the secret flow.
#   unit:         ruff + pytest against a fake OpenBao (always)
#   integration:  real run of action.yml against your OpenBao instance
#                 (needs repo variables OPENBAO_URL, OPENBAO_NAMESPACE and
#                  secrets OPENBAO_ROLE_ID, OPENBAO_SECRET_ID)
name: test-secret-flow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      secrets:
        description: "Secret specs to fetch (one per line)"
        default: "PATH=ci/test,PREFIX=TEST_"
      mount:
        default: kv/test

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04 # still ships Python 3.8 for setup-python
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  integration:
    needs: unit
    if: vars.OPENBAO_URL != '' && github.event_name != 'pull_request'
    runs-on: ${{ vars.OPENBAO_RUNNER && fromJSON(vars.OPENBAO_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets (stages 1-4)
        id: bao
        uses: ./
        with:
          url: ${{ vars.OPENBAO_URL }}
          namespace: ${{ vars.OPENBAO_NAMESPACE }}
          role-id: ${{ secrets.OPENBAO_ROLE_ID }}
          secret-id: ${{ secrets.OPENBAO_SECRET_ID }}
          mount: ${{ inputs.mount || 'kv/test' }}
          secrets: ${{ inputs.secrets || 'PATH=ci/test,PREFIX=TEST_' }}

      - name: Use the secrets (values must show as ***)
        env:
          KEYS: ${{ steps.bao.outputs.keys }}
        run: |
          test -n "$KEYS" || { echo "::error::no secret exported"; exit 1; }
          test -n "$OPENBAO_TOKEN" || { echo "::error::OPENBAO_TOKEN not exported"; exit 1; }
          for name in ${KEYS//,/ }; do
            test -n "${!name}" || { echo "::error::$name is empty"; exit 1; }
            echo "$name = ${!name}"      # proves masking: the log shows ***
          done
          python3 scripts/main.py check-token

      - name: Revoke token (stage 5)
        if: always()
        uses: ./
        with:
          command: revoke
          url: ${{ vars.OPENBAO_URL }}
          namespace: ${{ vars.OPENBAO_NAMESPACE }}

      - name: Token must be dead
        if: always()
        env:
          OPENBAO_URL: ${{ vars.OPENBAO_URL }}
          OPENBAO_NAMESPACE: ${{ vars.OPENBAO_NAMESPACE }}
        run: |
          if [ -z "${OPENBAO_TOKEN:-}" ]; then echo "no token was exported"; exit 0; fi
          if python3 scripts/main.py check-token; then
            echo "::error::token still valid after revoke"; exit 1
          fi
          echo "token revoked as expected"
