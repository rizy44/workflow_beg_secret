name: OpenBao secrets
description: >
  Export OpenBao KV v2 secrets as masked environment variables for the next steps
  of the job. Thin wrapper around scripts/openbao/fetch_secrets.py (same script
  the generic pipeline and Jenkins use).

# For repos that keep their own workflow instead of calling pipeline.yml:
#
#   permissions:
#     contents: read
#     id-token: write
#   steps:
#     - uses: rizy44/workflow_beg_secret/.github/actions/openbao-secrets@main
#       with:
#         bao_addr: ${{ vars.BAO_ADDR }}
#         namespace: ${{ vars.BAO_NAMESPACE }}
#         secrets: |
#           github/dockerhub token | DOCKERHUB_TOKEN

inputs:
  bao_addr:
    required: true
  secrets:
    description: "One per line: '<path> <key> [| ENV_NAME]' or '<path> * [| PREFIX_]'"
    required: true
  namespace:
    default: ""
  mount:
    description: KV v2 mount
    default: kv/test
  auth_method:
    description: jwt (GitHub OIDC) | approle
    default: jwt
  role:
    description: OpenBao jwt role
    default: github-actions
  jwt_mount:
    default: jwt
  audience:
    default: openbao
  role_id:
    default: ""
  secret_id:
    default: ""
  approle_mount:
    default: approle
  ca_cert_pem:
    default: ""

runs:
  using: composite
  steps:
    - name: Fetch secrets from OpenBao
      shell: bash
      env:
        SECRETS_SPEC: ${{ inputs.secrets }}
        BAO_ADDR: ${{ inputs.bao_addr }}
        BAO_NAMESPACE: ${{ inputs.namespace }}
        BAO_MOUNT: ${{ inputs.mount }}
        BAO_AUTH_METHOD: ${{ inputs.auth_method }}
        BAO_ROLE: ${{ inputs.role }}
        BAO_JWT_MOUNT: ${{ inputs.jwt_mount }}
        BAO_JWT_AUDIENCE: ${{ inputs.audience }}
        BAO_ROLE_ID: ${{ inputs.role_id }}
        BAO_SECRET_ID: ${{ inputs.secret_id }}
        BAO_APPROLE_MOUNT: ${{ inputs.approle_mount }}
        BAO_CACERT_PEM: ${{ inputs.ca_cert_pem }}
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/openbao/fetch_secrets.py"
