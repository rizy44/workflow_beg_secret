# Example: <any repo>/.github/workflows/ci.yml calling the generic pipeline.
# Repo/org variables: BAO_ADDR, BAO_NAMESPACE. No GitHub secret needed (OIDC).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: rizy44/workflow_beg_secret/.github/workflows/pipeline.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      bao_addr: ${{ vars.BAO_ADDR }}
      bao_namespace: ${{ vars.BAO_NAMESPACE }}
      secrets_file: .ci/secrets.txt # same file Jenkins uses
      setup: ./scripts/setup.sh
      test: ./scripts/test.sh
      build: ./scripts/build.sh
