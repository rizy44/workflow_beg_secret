# Example: a repo that keeps its own workflow and only needs the secrets step.
name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: rizy44/workflow_beg_secret/.github/actions/openbao-secrets@main
        with:
          bao_addr: ${{ vars.BAO_ADDR }}
          namespace: ${{ vars.BAO_NAMESPACE }}
          secrets: |
            github/dockerhub username | DOCKERHUB_USERNAME
            github/dockerhub token    | DOCKERHUB_TOKEN
      - run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
