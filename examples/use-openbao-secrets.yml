# Example: a pipeline in ANY repo of the owner/org that reads its secrets from OpenBao
# at runtime instead of `${{ secrets.X }}`. Copy to <repo>/.github/workflows/.
#
# Needs only the variable BAO_ADDR (org-level variable in an organization,
# repo-level variable on a personal account). No GitHub secret is required.
name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for OpenBao
    steps:
      - uses: actions/checkout@v4

      - name: Secrets from OpenBao
        uses: rizy44/workflow_beg_secret/.github/actions/openbao-secrets@main
        with:
          bao_addr: ${{ vars.BAO_ADDR }}
          secrets: |
            common/dockerhub username | DOCKERHUB_USERNAME
            common/dockerhub token    | DOCKERHUB_TOKEN
            github/sonarcloud token   | SONAR_TOKEN

      # Before: ${{ secrets.DOCKERHUB_TOKEN }}   After: $DOCKERHUB_TOKEN / ${{ env.DOCKERHUB_TOKEN }}
      - run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
